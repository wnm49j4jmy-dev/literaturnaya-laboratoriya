<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f1e8"><title>Литературная лаборатория</title><style>
:root{--ink:#253b35;--muted:#64736b;--paper:#f5f1e8;--card:#fffdf8;--line:#d7d6ca;--accent:#416b5b;--gold:#a27a3b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #c9a56b;outline-offset:3px}.shell{max-width:750px;margin:auto;padding:24px 19px 70px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;font-weight:750;color:var(--accent)}.brand{font:700 22px Georgia,serif}.small{font-size:13px;color:var(--muted)}h1,h2,h3{font-family:Georgia,serif;line-height:1.17}h1{font-size:clamp(35px,8vw,58px);letter-spacing:-.035em;margin:30px 0 18px}h2{font-size:clamp(28px,6vw,42px);margin:20px 0 16px}h3{font-size:24px;margin:0 0 10px}p{margin:12px 0}.lead{font-size:19px;max-width:600px}.muted{color:var(--muted)}.routes{display:grid;gap:14px;margin-top:27px}.route,.panel{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:22px}.route{display:block;width:100%;text-align:left;color:inherit}.route:hover,.choice:hover,.chip:hover{border-color:var(--accent)}.route .num{color:var(--gold);font:italic 23px Georgia,serif}.route h3{margin:7px 0}.route p{color:var(--muted);margin-bottom:0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.tag{font-size:12px;border:1px solid var(--line);padding:4px 9px;border-radius:30px;color:var(--muted)}.progress{height:5px;background:#dfe2d9;border-radius:5px;overflow:hidden;margin:20px 0 32px}.bar{height:100%;background:var(--accent);transition:width .2s}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}.link{background:none;border:0;color:var(--accent);padding:9px 0;text-decoration:underline;text-underline-offset:3px}.step{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}.quote{font:20px/1.55 Georgia,serif;border-left:3px solid #b9a17b;padding:10px 0 10px 19px;margin:22px 0;background:#faf7ef}.source{font:13px system-ui;color:var(--muted);margin-top:8px}.choices{display:grid;gap:10px;margin:20px 0}.choice,.chip{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px;color:var(--ink);text-align:left}.choice.selected,.chip.selected{border:2px solid var(--accent);background:#e8efe9;padding:13px 15px}.chip{display:inline-block;margin:5px 6px 5px 0}.btn{background:var(--accent);color:white;border:0;border-radius:10px;padding:13px 20px;font-weight:650;min-height:49px}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.alt{background:#e5e9e1;color:var(--ink)}.feedback{background:#edf1e8;border-left:3px solid var(--accent);padding:16px 18px;margin:20px 0;border-radius:0 10px 10px 0}.feedback strong{display:block;margin-bottom:5px}.arrange{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:12px;border:1px dashed #b8c3b8;border-radius:10px;margin:15px 0}.arrange button{border:1px solid var(--accent);background:#e9eee9;color:var(--ink);border-radius:8px;padding:7px 11px}.input{display:block;width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:16px 0}.hint{font-size:14px;color:var(--muted)}.footer{border-top:1px solid var(--line);margin-top:42px;padding-top:16px;font-size:12px;color:var(--muted)}.end{font-size:20px}.counter{color:var(--gold);font:italic 24px Georgia,serif}.note{font-size:14px;border-top:1px solid var(--line);padding-top:14px;margin-top:25px}@media(min-width:640px){.routes{grid-template-columns:1fr 1fr}.route:last-child{grid-column:1/-1}.shell{padding-top:35px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main id="app" class="shell"></main><script>
'use strict';
const routes=[
{id:'words',name:'Слова и обстоятельства',desc:'Когда значение слова оказывается важнее самого слова.',work:'А. П. Чехов · «Лошадиная фамилия»',steps:[
{kind:'single',title:'Фамилия, которую помнят приблизительно',intro:'У отставного генерал-майора Булдеева болит зуб. Приказчик вспоминает человека, который будто бы умеет лечить зубную боль заговором. Осталась одна трудность — фамилия.',quote:'«Такая еще простая фамилия... словно как бы лошадиная...»',question:'Что делает поиски фамилии особенно комичными?',options:['Все ищут точное слово по весьма неточному признаку.','Генерал не верит ни одному из окружающих.','Приказчик умышленно скрывает фамилию.'],correct:0,explain:'Слово «лошадиная» звучит как уверенная подсказка, хотя оставляет почти бесконечное поле догадок. Так возникает комизм языковой неточности.'},
{kind:'sort',title:'Каталог почти подходящих фамилий',intro:'В рассказе перебирают множество фамилий. Собери две группы: фамилии, прямо называющие лошадь или её возраст, и фамилии, связанные с тем, что лошадь ест.',question:'Сначала отметь фамилии из первой группы.',items:['Кобылин','Овсов','Жеребцов','Жеребятников'],correct:['Кобылин','Жеребцов','Жеребятников'],explain:'Кобыла, жеребец и жеребёнок называют самих животных. «Овсов» связан не с названием животного, а с его кормом. Именно такая ассоциация оказывается решающей.'},
{kind:'order',title:'Как мысль ходит по кругу',intro:'Нужно найти фамилию, но память подсовывает не слово, а ассоциацию. Восстанови логическую цепочку — нажимай элементы в нужном порядке.',items:['Вспоминается связь с лошадью','Перебираются «лошадиные» фамилии','Находится неожиданная связь с овсом'],correct:['Вспоминается связь с лошадью','Перебираются «лошадиные» фамилии','Находится неожиданная связь с овсом'],explain:'Важен не набор слов, а смена способа поиска: от буквального сходства к косвенной смысловой связи.'},
{kind:'single',title:'Разгадка, которая опоздала',intro:'Нужная фамилия — Овсов. Но её вспоминают уже после того, как зуб генералу удалили.',question:'Почему такая развязка сильнее, чем удачное лечение?',options:['Решение приходит ровно тогда, когда перестаёт быть нужным.','Овёс действительно лечит зубы.','Фамилия оказывается вымышленной.'],correct:0,explain:'Чехов доводит поиски до результата — и лишает результат практического смысла. Точность наконец достигнута, но слишком поздно.'},
{kind:'write',title:'Экспонат: бесполезная точность',intro:'Представь, что для истории нужен музейный ярлык. Дополни его одной короткой фразой.',question:'«Фамилию нашли, когда…»',placeholder:'Напиши продолжение',explain:'В рассказе смешно не только забытое имя, но и безупречно поздняя разгадка. Ты сформулировал(а) этот эффект своими словами.'}]},
{id:'images',name:'Искусство видеть иначе',desc:'Образы, в которых обычное вдруг становится необычным.',work:'Русская поэзия · Пушкин, Лермонтов, Тютчев',steps:[
{kind:'single',title:'Невозможное движение',intro:'Прочитай две строки из стихотворения М. Ю. Лермонтова «Парус».',quote:'«Белеет парус одинокой\nВ тумане моря голубом!..»',question:'Что здесь заставляет увидеть не просто предмет на море?',options:['Слово «одинокой» придаёт парусу человеческое состояние.','Указано точное время суток.','Парус подробно описан как устройство.'],correct:0,explain:'Эпитет «одинокой» связывает видимый предмет с переживанием. Пейзаж становится психологическим.'},
{kind:'match',title:'Природа ведёт себя как человек',intro:'Ф. И. Тютчев пишет: «Зима недаром злится, / Прошла её пора…»',question:'Выбери, что делает глагол «злится» с образом зимы.',options:['Превращает природное явление в действующее лицо.','Обозначает точную температуру воздуха.','Доказывает, что зима говорит вслух.'],correct:0,explain:'Это олицетворение. Зима получает человеческую эмоцию, а смена времён года становится маленьким конфликтом.'},
{kind:'sort',title:'Образ или наблюдение?',intro:'Одни выражения фиксируют видимое, другие заставляют предмет вести себя не по правилам реального мира.',question:'Отметь выражения, в которых есть переносное значение.',items:['Море синее','Зима злится','Парус белеет','Туча ночевала'],correct:['Зима злится','Туча ночевала'],explain:'«Зима злится» — олицетворение у Тютчева, «Туча ночевала» — олицетворение у Лермонтова («Утёс»). Цвет моря и белизна паруса могут быть буквальными наблюдениями.'},
{kind:'single',title:'Туча в гостях',intro:'В стихотворении М. Ю. Лермонтова «Утёс» есть строка:',quote:'«Ночевала тучка золотая\nНа груди утёса-великана…»',question:'Какое сочетание создаёт самый неожиданный образ?',options:['«Ночевала» и «на груди» — как будто туча и утёс живые.','«Тучка» и «золотая» — указание на драгоценный металл.','«Утёс» и «великан» — географическое измерение.'],correct:0,explain:'Олицетворение и метафорическое сближение превращают пейзаж в историю о встрече и расставании.'},
{kind:'order',title:'От предмета — к чувству',intro:'Разложи путь, по которому художественная деталь становится образом.',items:['Вижу парус','Замечаю слово «одинокой»','Чувствую одиночество'],correct:['Вижу парус','Замечаю слово «одинокой»','Чувствую одиночество'],explain:'Художественный образ работает не только через предмет, но и через отношение, которое читатель считывает из слова.'}]},
{id:'nature',name:'Тонкости человеческой натуры',desc:'Как одна деталь выдаёт характер лучше длинной характеристики.',work:'А. П. Чехов · «Хамелеон», «Толстый и тонкий»',steps:[
{kind:'single',title:'Перемена температуры',intro:'В «Хамелеоне» полицейский надзиратель Очумелов разбирает историю с собакой. Его решение меняется вместе с предположениями о её хозяине.',question:'Что становится настоящим предметом разбирательства?',options:['Не поступок собаки, а возможный статус её владельца.','Порода собаки и её возраст.','Состояние городского рынка.'],correct:0,explain:'Комизм в том, что «справедливость» зависит от того, кому принадлежит собака. Название рассказа — ключ к характеру героя.'},
{kind:'sort',title:'Улики вместо диагноза',intro:'Чехов редко объявляет героя лицемером прямым авторским приговором. Он даёт читателю наблюдать за поведением.',question:'Отметь детали, которые могут выдать чинопочитание.',items:['Меняет решение после упоминания генерала','Говорит о погоде','Становится почтительнее к человеку высокого чина','Стоит на площади'],correct:['Меняет решение после упоминания генерала','Становится почтительнее к человеку высокого чина'],explain:'Не каждая подробность — характеристика. Выразительна та, которая показывает зависимость поведения от чина.'},
{kind:'single',title:'Два старых знакомых',intro:'В рассказе «Толстый и тонкий» бывшие школьные товарищи встречаются на вокзале. Сначала они разговаривают свободно, но затем тонкий узнаёт чин толстого.',question:'Что меняется в их общении?',options:['Тёплая встреча уступает место подобострастию.','Оба внезапно забывают друг друга.','Толстый начинает требовать официального отчёта.'],correct:0,explain:'Чехову не нужно менять обстоятельства встречи. Достаточно одного сообщения о чине — и характер обнаруживается в речи и жестах.'},
{kind:'order',title:'Механика неловкости',intro:'Расположи события так, чтобы стала видна чеховская конструкция комической сцены.',items:['Встреча старых приятелей','Известие о высоком чине','Неловкая почтительность'],correct:['Встреча старых приятелей','Известие о высоком чине','Неловкая почтительность'],explain:'Сюжет почти неподвижен, но социальная дистанция за несколько секунд становится огромной.'},
{kind:'write',title:'Портрет без прилагательного',intro:'Попробуй сформулировать, что объединяет Очумелова и тонкого, не употребляя слова «лицемерный» и «подобострастный».',question:'«Они меняются, когда…»',placeholder:'Твоя формулировка',explain:'Хорошая характеристика персонажа может описывать не свойство само по себе, а обстоятельство, при котором оно проявляется.'}]}];
const app=document.getElementById('app');let current=null,step=0,selected=[],revealed=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const store=(id,n)=>{try{localStorage.setItem('litlab-'+id,String(n))}catch(e){}};const get=id=>{try{return Math.max(0,Math.min(5,Number(localStorage.getItem('litlab-'+id)||0)))}catch(e){return 0}};function header(){return '<header class="top"><div><div class="eyebrow">Неделя русского языка и литературы</div><div class="brand">Литературная лаборатория</div></div><span class="small">5–8 классы</span></header>'}function home(){current=null;app.innerHTML=header()+'<h1>Слова имеют обстоятельства.</h1><p class="lead">А герои — характер. Три небольших исследования о том, как литература умеет говорить больше, чем написано.</p><p class="small">Выбирай маршрут в любом порядке. Каждый займёт около 8–10 минут. Никакой регистрации.</p><section class="routes">'+routes.map((r,i)=>'<button class="route" data-route="'+r.id+'"><span class="num">0'+(i+1)+'</span><h3>'+r.name+'</h3><p>'+r.desc+'</p><div class="meta"><span class="tag">5 наблюдений</span><span class="tag">'+(get(r.id)===5?'Пройден':get(r.id)?'Продолжить · '+get(r.id)+'/5':'Начать')+'</span></div></button>').join('')+'</section><p class="note muted">Все литературные примеры сопровождаются указанием произведения. Ответы сохраняются только в браузере этого устройства; учителю они автоматически не отправляются.</p>'+footer();document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>start(b.dataset.route))}function footer(){return '<footer class="footer">Литературная лаборатория · Учебный интерактивный проект · Без внешних сервисов и сбора личных данных</footer>'}function start(id){current=routes.find(r=>r.id===id);step=get(id);if(step>=5)step=0;selected=[];revealed=false;render()}function render(){if(!current)return home();if(step>=current.steps.length)return finish();let s=current.steps[step];app.innerHTML=header()+'<div class="nav"><button class="link" id="back">← Все маршруты</button><span class="step">'+(step+1)+' / '+current.steps.length+'</span></div><div class="progress"><div class="bar" style="width:'+((step+1)/current.steps.length*100)+'%"></div></div><div class="eyebrow">'+esc(current.name)+'</div><h2>'+esc(s.title)+'</h2><p>'+esc(s.intro)+'</p>'+(s.quote?'<blockquote class="quote">'+esc(s.quote).replace(/\n/g,'<br>')+'<div class="source">'+esc(current.work)+'</div></blockquote>':'')+'<section class="panel"><h3>'+esc(s.question)+'</h3><div id="interaction"></div><div id="response" aria-live="polite"></div><button class="btn" id="action">'+(s.kind==='write'?'Завершить наблюдение':'Проверить наблюдение')+'</button></section><p class="source">Материал: '+esc(current.work)+'</p>'+footer();document.getElementById('back').onclick=home;renderInteraction(s)}function renderInteraction(s){let node=document.getElementById('interaction'),btn=document.getElementById('action');if(['single','match'].includes(s.kind)){node.innerHTML='<div class="choices">'+s.options.map((v,i)=>'<button class="choice" data-i="'+i+'">'+esc(v)+'</button>').join('')+'</div>';node.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(revealed)return;selected=[Number(b.dataset.i)];node.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));btn.disabled=false});btn.disabled=true}else if(s.kind==='sort'){node.innerHTML='<p class="hint">Можно выбрать несколько вариантов.</p>'+s.items.map((v,i)=>'<button class="chip" data-i="'+i+'">'+esc(v)+'</button>').join('');node.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(revealed)return;let i=Number(b.dataset.i);selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];b.classList.toggle('selected',selected.includes(i));btn.disabled=!selected.length});btn.disabled=true}else if(s.kind==='order'){node.innerHTML='<p class="hint">Нажимай фразы по очереди. Нажатие на собранную фразу отменяет последний выбор.</p><div class="arrange" id="arrange"></div><div id="pool"></div>';let order=s.items.map((_,i)=>i);order=[...order.slice(1),order[0]];function draw(){document.getElementById('arrange').innerHTML=selected.map((i,n)=>'<button data-pos="'+n+'">'+esc(s.items[i])+' ×</button>').join('');document.getElementById('pool').innerHTML=order.filter(i=>!selected.includes(i)).map(i=>'<button class="chip" data-i="'+i+'">'+esc(s.items[i])+'</button>').join('');document.querySelectorAll('#pool button').forEach(b=>b.onclick=()=>{if(revealed)return;selected.push(Number(b.dataset.i));draw()});document.querySelectorAll('#arrange button').forEach(b=>b.onclick=()=>{if(revealed)return;selected=selected.slice(0,Number(b.dataset.pos));draw()});btn.disabled=selected.length!==s.items.length}draw()}else{node.innerHTML='<input class="input" id="answer" maxlength="180" placeholder="'+esc(s.placeholder)+'" aria-label="Ваш ответ"><p class="hint">Здесь нет единственного правильного ответа. Важна точность мысли.</p>';btn.disabled=true;document.getElementById('answer').oninput=e=>btn.disabled=e.target.value.trim().length<5}btn.onclick=()=>check(s)}function check(s){if(revealed){step++;selected=[];revealed=false;store(current.id,step);render();return}let ok=true;if(['single','match'].includes(s.kind))ok=selected[0]===s.correct;else if(s.kind==='sort')ok=selected.map(i=>s.items[i]).sort().join('|')===s.correct.slice().sort().join('|');else if(s.kind==='order')ok=selected.map(i=>s.items[i]).join('|')===s.correct.join('|');let res=document.getElementById('response');if(!ok){res.innerHTML='<div class="feedback"><strong>Пока не совсем.</strong>Попробуй ещё раз: здесь важна не первая ассоциация, а то, что происходит со смыслом.</div>';return}revealed=true;res.innerHTML='<div class="feedback"><strong>'+(s.kind==='write'?'Наблюдение записано.':'Точно подмечено.')+'</strong>'+esc(s.explain)+'</div>';let btn=document.getElementById('action');btn.disabled=false;btn.textContent=step===current.steps.length-1?'Завершить маршрут':'Следующее наблюдение →';if(s.kind==='write'){document.getElementById('answer').disabled=true}else document.querySelectorAll('#interaction button').forEach(b=>b.disabled=true)}function finish(){store(current.id,5);app.innerHTML=header()+'<div class="nav"><button class="link" id="back">← К маршрутам</button><span class="step">5 / 5</span></div><div class="progress"><div class="bar" style="width:100%"></div></div><div class="counter">Исследование завершено</div><h1>'+esc(current.name)+'</h1><p class="end">Литература редко даёт готовый ответ. Зато учит замечать, почему вопрос поставлен именно так.</p><div class="panel"><h3>Отметка в лабораторном журнале</h3><p>Все пять наблюдений пройдены. Результат сохранён в этом браузере.</p><button class="btn" id="home">Выбрать другой маршрут</button> <button class="btn alt" id="repeat">Пройти ещё раз</button></div>'+footer();document.getElementById('back').onclick=home;document.getElementById('home').onclick=home;document.getElementById('repeat').onclick=()=>{store(current.id,0);step=0;selected=[];revealed=false;render()}}home();
</script></body></html>
