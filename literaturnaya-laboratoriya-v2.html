<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4f5f8"><title>Между строк — литературная лаборатория</title><style>
:root{--bg:#f4f5f8;--ink:#1c2435;--muted:#596577;--line:#dce1ea;--white:#fff;--blue:#3458e8;--bluep:#eaf0ff;--green:#146b55;--greenp:#e5f7f0;--orange:#ad571f;--orangep:#fff0df}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.48 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #8aa0ff;outline-offset:3px}.app{max-width:640px;margin:0 auto;min-height:100svh;padding:0 18px calc(34px + env(safe-area-inset-bottom))}.top{height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:850;letter-spacing:-.055em;font-size:24px}.logo span{color:var(--blue)}.edition{font-size:12px;font-weight:750;color:var(--muted);background:#e8eaf0;border-radius:50px;padding:7px 10px}.hero{padding:38px 0 22px}.kicker{font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--blue)}h1{font-size:clamp(38px,9.5vw,58px);letter-spacing:-.065em;line-height:1.02;margin:14px 0 18px;font-weight:850}h2{font-size:clamp(29px,7vw,40px);letter-spacing:-.05em;line-height:1.13;margin:12px 0 14px}p{margin:10px 0 14px}.lead{font-size:18px;color:#465267;line-height:1.52}.route-list{display:grid;gap:12px;margin-top:20px}.route{background:white;border:1px solid var(--line);border-radius:22px;padding:21px;text-align:left;color:inherit;width:100%;box-shadow:0 4px 16px #24304c06;transition:transform .12s}.route:active,.option:active,.pill:active{transform:scale(.985)}.route-top{display:flex;justify-content:space-between;align-items:center}.number{font-weight:800;color:var(--blue);font-size:13px}.arrow{display:grid;place-items:center;background:var(--bluep);color:var(--blue);border-radius:50%;width:35px;height:35px;font-size:21px}.route h3{font-size:23px;letter-spacing:-.04em;line-height:1.12;margin:13px 0 8px}.route p{color:var(--muted);margin:0}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px}.tag{background:#f1f3f7;color:#485469;border-radius:30px;padding:5px 10px;font-size:12px;font-weight:650}.foot{font-size:12px;color:var(--muted);padding:30px 0}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}.back{border:0;background:transparent;padding:10px 0;font-weight:750;color:var(--blue)}.count{font-size:13px;color:var(--muted);font-weight:750}.progress{height:6px;border-radius:8px;background:#dfe4ec;overflow:hidden;margin:6px 0 24px}.progress div{height:100%;background:var(--blue);border-radius:8px;transition:width .2s}.context{font-size:13px;font-weight:750;color:var(--blue);margin:12px 0}.intro{color:#4d5b6c;font-size:16px;line-height:1.6}.quote{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:15px;padding:19px 20px;margin:18px 0;font:20px/1.55 Georgia,serif;white-space:pre-line}.source{font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted);margin-top:13px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:19px;margin-top:20px;box-shadow:0 6px 20px #182b4b06}.question{font-size:19px;line-height:1.35;font-weight:800;letter-spacing:-.025em;margin:0 0 17px}.option{width:100%;display:flex;align-items:center;gap:12px;background:white;border:1.5px solid #dce1eb;border-radius:14px;padding:15px 14px;text-align:left;color:var(--ink);margin:9px 0;min-height:56px;line-height:1.4}.option.selected{border-color:var(--blue);background:var(--bluep)}.option .dot{width:21px;height:21px;border:2px solid #aeb8c9;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px}.option.selected .dot{background:var(--blue);border-color:var(--blue);color:white}.pill{border:1.5px solid #dce1eb;background:#fff;color:var(--ink);padding:11px 14px;border-radius:13px;margin:4px 6px 4px 0;text-align:left}.pill.selected{background:var(--bluep);border-color:var(--blue)}.picked{background:#f1f4fa;border:1px dashed #c7d0e0;border-radius:13px;padding:10px;min-height:60px;margin:12px 0}.hint{font-size:13px;color:var(--muted);margin:8px 0}.primary{border:0;background:var(--blue);color:white;font-weight:800;border-radius:15px;min-height:54px;padding:13px 18px;width:100%;margin-top:18px}.primary:disabled{opacity:.42;cursor:default}.feedback{background:var(--greenp);border-radius:15px;padding:16px;color:#124d3e;margin-top:15px}.feedback strong{display:block;margin-bottom:5px}.feedback.try{background:var(--orangep);color:#7d431b}.input{width:100%;border:1.5px solid #cdd5e2;border-radius:14px;padding:16px;background:white;min-height:58px}.done{background:var(--greenp);padding:25px;border-radius:22px;margin:28px 0}.done h2{margin-top:5px}.secondary{background:white;color:var(--blue);border:1px solid #b9c6ff;border-radius:15px;padding:14px;font-weight:750;width:100%;margin-top:10px}.mini{font-size:13px;color:var(--muted)}@media(min-width:600px){.app{padding-left:26px;padding-right:26px}.route-list{grid-template-columns:1fr 1fr}.route:last-child{grid-column:span 2}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.reveal-list{display:grid;gap:10px}.reveal-tile{width:100%;text-align:left;background:#f8faff;border:1px solid #d5deed;border-radius:16px;padding:17px;min-height:66px;color:var(--ink);display:grid;gap:7px}.reveal-tile>span:first-child{font-weight:800;font-size:17px}.tile-more{font-size:13px;color:var(--blue)}.tile-detail{font-size:15px;line-height:1.5;color:#42516b}.reveal-tile[aria-expanded=true]{border-color:#91a5df;background:#eef3ff}.route:focus-visible,.reveal-tile:focus-visible{outline:3px solid #8aa0ff;outline-offset:3px}@media(max-width:380px){.app{padding-left:14px;padding-right:14px}.quote{font-size:18px;padding:16px}.card{padding:15px}} </style></head><body><main class="app" id="app"><header class="top"><div class="logo">между<span>строк</span><span aria-hidden="true">.</span></div><div class="edition">5–8 классы</div></header><section class="hero"><div class="kicker">Литературная лаборатория</div><h1>В тексте есть<br>кое-что ещё.</h1><p class="lead">Три истории о том, как слова обманывают ожидания, природа получает характер, а люди выдают себя одной фразой.</p></section><p>Если видишь этот экран, сайт загружен. Для начала игры нужен браузер с поддержкой JavaScript.</p></main><script>
'use strict';
const routes=[
{id:'words',name:'Слова и обстоятельства',subtitle:'Детектив, в котором улика мешает расследованию.',author:'А. П. Чехов',work:'«Лошадиная фамилия»',steps:[
{type:'choice',title:'Подсказка с характером',intro:'У Булдеева болит зуб. Приказчик забыл фамилию человека, который якобы лечит зубную боль заговором. Помнит только одно:',quote:'«Такая еще простая фамилия... словно как бы лошадиная...»',question:'Что не так с этой подсказкой?',options:['Она описывает ассоциацию, а не саму фамилию','Она называет фамилию почти полностью','Она объясняет, как лечить зуб'],answer:0,why:'Все понимают слово «лошадиная» по-своему. Именно поэтому поиски становятся бесконечными.'},
{type:'multi',title:'Лошадиный отдел',intro:'Герои предлагают фамилии, связанные с лошадьми. Сравни варианты, связанные с лошадьми. Не все они устроены одинаково.',question:'В каких фамилиях слышатся слова «кобыла», «жеребец», «жеребёнок»?',options:['Кобылин','Жеребцов','Жеребятников','Конюхов'],answer:[0,1,2],why:'Кобыла, жеребец, жеребёнок — прямые связи. Конюхов — связь с человеком, который ухаживает за лошадьми; это не название самой лошади.'},
{type:'choice',title:'Слишком узкий поиск',intro:'Перебрали множество фамилий, но нужную так и не нашли. Возможно, искали слишком буквально.',question:'Какую новую область ассоциаций стоило бы проверить?',options:['Корм, упряжь и конюшню','Только породы лошадей','Только имена знаменитых коней'],answer:0,why:'Связь может быть не прямой, а опосредованной. Но какая именно — пока неизвестно.'},
{type:'order',title:'Как работает ошибка',intro:'Разложи три шага в том порядке, в каком возникает недоразумение.',question:'Нажимай фразы по очереди.',options:['Память сохраняет смутную ассоциацию','Все ищут буквальную «лошадиную» фамилию','Подсказку понимают шире — и находят ответ'],answer:[0,1,2],why:'Комизм построен на столкновении двух способов думать: по прямому значению и по ассоциации.'},
{type:'reveal',title:'Фамилия как улика',intro:'Фамилии из рассказа — не просто список. Открой три способа, которыми память пытается добраться до слова.',question:'Что именно вспоминают герои?',options:[['Через животное','Кобылин и Жеребцов: связь с лошадью прямая.'],['Через действие','Поиск не ограничивается названиями животных: воображение строит цепочки.'],['Через окружение','Подсказка может относиться не к лошади, а к тому, что рядом с ней.']],why:'Одна ассоциация допускает десятки путей. У памяти нет словаря с алфавитным указателем.'},
{type:'write',title:'Проверка собственной памяти',intro:'Представь: ты помнишь не слово, а его настроение или окружение. Это бывает даже со знакомыми именами.',question:'Закончи фразу: «Я забыл(а) слово, но точно помню, что оно связано с…»',placeholder:'Любая конкретная ассоциация',why:'Чем точнее ассоциация, тем полезнее подсказка. Но точность и очевидность — не одно и то же.'},
{type:'choice',title:'Зачем Чехов тянет время?',intro:'Сюжет можно было бы закончить за два предложения: фамилию забыли, потом вспомнили. Но Чехов заставляет героев перебирать варианты.',question:'Что даёт читателю длинный и бесплодный поиск?',options:['Мы сами попадаем в ловушку подсказки','Узнаём, сколько в России фамилий','Получаем инструкцию по лечению зубов'],answer:0,why:'Читатель тоже начинает искать «лошадь» в фамилии. Поэтому развязка срабатывает не только для героев.'},
{type:'choice',title:'Финал без аплодисментов',intro:'После удаления зуба доктор просит у приказчика овса для лошади. Только тут приказчик вспоминает фамилию: Овсов.',question:'Почему развязка смешнее удачного лечения?',options:['Найденное слово больше никому не нужно','Генерал оказывается ветеринаром','Приказчик выдумал всю историю'],answer:0,why:'Задача наконец решена. Только самой задачи уже нет. Чехов умеет точно выбрать момент для разгадки.'}]},
{id:'images',name:'Искусство видеть иначе',subtitle:'Одно слово меняет всю картину.',author:'Лермонтов · Тютчев · Пушкин',work:'Русская поэзия',steps:[
{type:'choice',title:'01. Лермонтов: парус',intro:'М. Ю. Лермонтов, «Парус». Сначала — одна картина:',quote:'«Белеет парус одинокой\nВ тумане моря голубом!..»',question:'Какое слово превращает вид моря в историю о чувстве?',options:['«одинокой»','«тумане»','«голубом»'],answer:0,why:'«Одинокой» относится к парусу, но отзывается человеческим переживанием. Так пейзаж становится больше, чем пейзаж.'},
{type:'choice',title:'02. Тютчев: зима',intro:'Ф. И. Тютчев, «Зима недаром злится…». Здесь времена года ведут себя неожиданно:',quote:'«Зима недаром злится,\nПрошла её пора…»',question:'Что меняет глагол «злится»?',options:['Зима становится персонажем с эмоциями','Мы узнаём температуру воздуха','Поэт описывает метель научным языком'],answer:0,why:'Это олицетворение: явление природы получает человеческое чувство. Весна и зима превращаются в участников конфликта.'},
{type:'multi',title:'03. Лермонтов: утёс',intro:'Ещё один текст Лермонтова — «Утёс». Теперь посмотри, что поэт делает с облаком и скалой.',quote:'«Ночевала тучка золотая\nНа груди утёса-великана…»',question:'Какие слова делают пейзаж похожим на историю живых существ?',options:['«Ночевала»','«На груди»','«золотая» как обозначение металла'],answer:[0,1],why:'«Ночевала» и «на груди» наделяют тучку и утёс чертами живых существ. «Золотая» — образное определение цвета, а не указание на металл.'},
{type:'choice',title:'04. Пушкин: море',intro:'А. С. Пушкин, «К морю». Поэт обращается к морю не как к географическому объекту:',quote:'«Прощай, свободная стихия!»',question:'Как поэт показывает, что море для него больше, чем пейзаж?',options:['К морю обращаются как к собеседнику','Море названо маленьким','Названа точная ширина моря'],answer:0,why:'Поэт прощается с морем как с близким собеседником. «Свободная стихия» связывает его образ с идеей свободы.'},
{type:'reveal',title:'Один пейзаж — три оптики',intro:'Сравни, что меняется, когда поэт выбирает не нейтральное описание, а образ. Открой карточки.',question:'Как слова меняют взгляд?',options:[['Лермонтов · «Парус»','«Одинокой» — парус становится образом человеческого состояния.'],['Тютчев · «Зима недаром злится…»','«Злится» — зима получает характер и вступает в конфликт.'],['Пушкин · «К морю»','«Прощай» — к морю обращаются как к собеседнику.']],why:'Это разные приёмы. Не стоит называть всё олицетворением: важно видеть, что именно делает слово.'},
{type:'multi',title:'Не всё — олицетворение',intro:'Теперь проверим границу термина. Олицетворение наделяет неживое человеческими чертами.',question:'Где именно есть олицетворение?',options:['«Зима недаром злится»','«Белеет парус»','«Ночевала тучка золотая»','«В тумане моря голубом»'],answer:[0,2],why:'Зима испытывает гнев, тучка ночует. А парус просто белеет: не всякий выразительный глагол — олицетворение.'},
{type:'write',title:'Сила одного слова',intro:'Выбери любой из трёх образов: парус, зима, море. Не нужно писать стихотворение.',question:'Какое слово из прочитанного ты бы точно не убрал(а) — и почему?',placeholder:'Слово и короткое объяснение',why:'Хорошее наблюдение опирается на конкретное слово и объясняет его действие. Программа не проверяет этот ответ — его можно обсудить с одноклассниками.'},
{type:'order',title:'05. Как рождается образ',intro:'Вернёмся к парусу Лермонтова. Попробуй собрать путь читателя от детали к смыслу.',question:'Нажимай по порядку.',options:['Вижу парус на море','Замечаю слово «одинокой»','Считываю чувство одиночества'],answer:[0,1,2],why:'Художественная деталь действует постепенно: сначала мы видим предмет, затем замечаем слово, затем улавливаем переживание.'}]},
{id:'people',name:'Тонкости человеческой натуры',subtitle:'Люди меняются быстрее обстоятельств.',author:'А. П. Чехов',work:'«Хамелеон» · «Толстый и тонкий»',steps:[
{type:'choice',title:'Дело о собаке',intro:'В «Хамелеоне» Очумелов разбирается в происшествии с собакой. Его суждения меняются вместе с предположениями о её хозяине.',question:'Что на самом деле определяет его позицию?',options:['Положение предполагаемого хозяина','Показания пострадавшего','Поведение собаки'],answer:0,why:'Правила внезапно оказываются гибкими, когда речь заходит о влиятельном владельце.'},
{type:'multi',title:'Показания поведения',intro:'В рассказе характер виден не по табличке «лицемер», а по действиям.',question:'Какие признаки действительно выдают чинопочитание?',options:['Решение меняется после упоминания генерала','Очумелов пытается выяснить, чья собака','Тон зависит от предполагаемого владельца','Очумелов слушает свидетелей'],answer:[0,2],why:'Важны не случайные детали, а то, что показывает зависимость поведения от чужого положения.'},
{type:'choice',title:'Встреча на вокзале',intro:'В «Толстом и тонком» два старых товарища радуются встрече. Но тонкий узнаёт высокий чин толстого.',question:'Что происходит с разговором?',options:['Дружеский тон уступает подобострастию','Собеседники начинают обсуждать работу','Они решают поскорее расстаться'],answer:0,why:'Чин меняет не обстоятельства, а речь и поведение тонкого. Этого достаточно, чтобы встреча стала неловкой.'},
{type:'order',title:'Три секунды неловкости',intro:'Чехов строит сцену на очень небольшом повороте.',question:'Собери цепочку.',options:['Радостная встреча','Известие о чине','Почтительность вместо дружбы'],answer:[0,1,2],why:'Читатель видит перемену почти мгновенно. Так автору не приходится объяснять характер героя отдельно.'},
{type:'reveal',title:'Два рассказа. Один механизм.',intro:'У Чехова герои редко произносят о себе правду вслух. Её приходится замечать в поведении.',question:'Открой две детали.',options:[['«Хамелеон»','Отношение к собаке меняется вместе с предположением о её владельце.'],['«Толстый и тонкий»','Дружеская беседа меняется, когда один из товарищей узнаёт чин другого.']],why:'События разные, но обе сцены устроены как мгновенная смена поведения перед властью.'},
{type:'choice',title:'Ирония без авторского комментария',intro:'В обоих рассказах Чехов показывает перемену героя. Ему не нужно добавлять длинное объяснение, что это плохо.',question:'Почему такой способ сильнее прямого осуждения?',options:['Читатель сам замечает противоречие','Автор избегает любых оценок и смысла','Герои становятся положительными'],answer:0,why:'Ирония возникает между тем, каким герой хочет казаться, и тем, как он ведёт себя на деле.'},
{type:'write',title:'Редакторская правка',intro:'Перед тобой слишком общий вывод: «Чехов высмеивает плохих людей». Он ничего не объясняет.',question:'Замени его одной точной фразой: какую привычку людей показывают эти два рассказа?',placeholder:'Не ярлык, а наблюдение',why:'Точная интерпретация называет не «плохого человека», а механизм поведения: зависимость тона и решений от чужого статуса.'},
{type:'write',title:'Диагноз без ярлыка',intro:'Два рассказа, одна человеческая слабость. Попробуй описать её без слов «лицемерие» и «подобострастие».',question:'Они меняют своё поведение, когда…',placeholder:'Закончи мысль',why:'Сравни свою мысль с рассказами: оба героя подстраивают речь и поступки под чужой чин или положение. Здесь важнее наблюдение, чем ярлык.'}]}
];
const app=document.getElementById('app');let route=null,index=0,selected=[],locked=false;const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=id=>'litlab-v2-'+id;function saved(id){try{return Math.max(0,Math.min(routes.find(r=>r.id===id)?.steps.length||8,Number(localStorage.getItem(key(id))||0)))}catch{return 0}}function save(id,n){try{localStorage.setItem(key(id),String(n))}catch{}}function top(){return '<header class="top"><div class="logo">между<span>строк</span>.</div><div class="edition">5–8 классы</div></header>'}function home(){route=null;app.innerHTML=top()+'<section class="hero"><div class="kicker">Неделя русского языка и литературы</div><h1>В тексте есть<br>кое-что ещё.</h1><p class="lead">Здесь слова ведут двойную жизнь, природа получает характер, а люди выдают себя одной фразой.</p><p class="mini">Выбирай любой маршрут. 8 эпизодов в каждом маршруте · около 8–10 минут · без регистрации.</p></section><section class="route-list">'+routes.map((r,i)=>'<button class="route" data-route="'+r.id+'"><div class="route-top"><span class="number">МАРШРУТ 0'+(i+1)+'</span><span class="arrow">↗</span></div><h3>'+escapeHTML(r.name)+'</h3><p>'+escapeHTML(r.subtitle)+'</p><div class="tags"><span class="tag">'+escapeHTML(r.author)+'</span><span class="tag">'+(saved(r.id)===r.steps.length?'Пройден ✓':saved(r.id)?'Продолжить · '+saved(r.id)+'/'+r.steps.length:'Начать · '+r.steps.length+' эпизодов')+'</span></div></button>').join('')+'</section><div class="foot">Прогресс хранится только в этом браузере. Личные данные не собираются, результаты учителю не отправляются.</div>';app.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.route)))}function start(id){route=routes.find(r=>r.id===id);index=saved(id);if(index===route.steps.length)index=0;selected=[];locked=false;render()}function render(){if(index>=route.steps.length)return finish();const s=route.steps[index];app.innerHTML=top()+'<div class="nav"><button class="back" id="back">← Маршруты</button><span class="count">'+(index+1)+' из '+route.steps.length+'</span></div><div class="progress" aria-label="Прогресс"><div style="width:'+(index/route.steps.length*100)+'%"></div></div><div class="context">'+escapeHTML(route.name)+' · '+escapeHTML(route.author)+'</div><h2>'+escapeHTML(s.title)+'</h2><p class="intro">'+escapeHTML(s.intro)+'</p>'+(s.quote?'<blockquote class="quote">'+escapeHTML(s.quote)+'<div class="source">'+escapeHTML(s.source||route.author+' · '+route.work)+'</div></blockquote>':'')+'<section class="card"><h3 class="question">'+escapeHTML(s.question)+'</h3><div id="choices"></div><div id="feedback" aria-live="polite"></div><button id="action" class="primary" disabled>'+(s.type==='write'?'Готово':'Проверить')+'</button></section><div class="foot">'+escapeHTML(s.source||route.author+' · '+route.work)+'</div>';document.getElementById('back').onclick=home;setup(s);window.scrollTo(0,0)}function setup(s){const area=document.getElementById('choices'),action=document.getElementById('action');if(s.type==='reveal'){area.innerHTML='<div class="reveal-list">'+s.options.map((v,i)=>'<button class="reveal-tile" data-i="'+i+'" aria-expanded="false"><span>'+escapeHTML(v[0])+'</span><span class="tile-more">Нажми, чтобы открыть ↗</span><span class="tile-detail" hidden>'+escapeHTML(v[1])+'</span></button>').join('')+'</div><div class="hint">Открой все карточки, затем продолжай.</div>';let opened=new Set();area.querySelectorAll('button').forEach(b=>b.onclick=()=>{opened.add(+b.dataset.i);b.setAttribute('aria-expanded','true');b.querySelector('.tile-more').hidden=true;b.querySelector('.tile-detail').hidden=false;action.disabled=opened.size!==s.options.length});}else if(s.type==='write'){area.innerHTML='<input class="input" id="writing" maxlength="180" placeholder="'+escapeHTML(s.placeholder)+'" aria-label="Продолжи фразу"><div class="hint">Здесь нет единственного ответа.</div>';area.querySelector('input').oninput=e=>action.disabled=e.target.value.trim().length<6}else if(s.type==='order'){selected=[];const order=[1,2,0];function draw(){area.innerHTML='<div class="hint">Собранная последовательность (нажми, чтобы отменить):</div><div class="picked">'+selected.map((n,i)=>'<button class="pill selected" data-undo="'+i+'">'+(i+1)+'. '+escapeHTML(s.options[n])+' ×</button>').join('')+'</div><div class="hint">Выбери следующую фразу:</div>'+order.filter(n=>!selected.includes(n)).map(n=>'<button class="pill" data-pick="'+n+'">'+escapeHTML(s.options[n])+'</button>').join('');area.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(locked)return;selected.push(+b.dataset.pick);draw()});area.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{if(locked)return;selected=selected.slice(0,+b.dataset.undo);draw()});action.disabled=selected.length!==s.options.length}draw()}else{area.innerHTML=(s.type==='multi'?'<div class="hint">Можно выбрать несколько.</div>':'')+s.options.map((v,i)=>'<button class="option" data-i="'+i+'" aria-pressed="false"><span class="dot"></span><span>'+escapeHTML(v)+'</span></button>').join('');area.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(locked)return;let i=+b.dataset.i;selected=s.type==='multi'?(selected.includes(i)?selected.filter(x=>x!==i):[...selected,i]):[i];area.querySelectorAll('button').forEach(x=>{let active=selected.includes(+x.dataset.i);x.classList.toggle('selected',active);x.setAttribute('aria-pressed',String(active));x.querySelector('.dot').textContent=active?'✓':''});action.disabled=selected.length===0})}action.onclick=()=>{if(locked){index++;save(route.id,index);selected=[];locked=false;render();return}let ok=s.type==='reveal'||s.type==='write'||(s.type==='choice'?selected[0]===s.answer:s.type==='multi'?JSON.stringify([...selected].sort())===JSON.stringify([...s.answer].sort()):JSON.stringify(selected)===JSON.stringify(s.answer));const fb=document.getElementById('feedback');if(!ok){fb.innerHTML='<div class="feedback try"><strong>Пока не сходится.</strong>Вернись к детали: она важнее общего впечатления.</div>';return}locked=true;fb.innerHTML='<div class="feedback"><strong>'+(s.type==='write'?'Ответ не оценивается автоматически.':'Именно.')+'</strong>'+escapeHTML(s.why)+'</div>';area.querySelectorAll('button,input').forEach(x=>x.disabled=true);action.disabled=false;action.textContent=index===route.steps.length-1?'Завершить маршрут':'Дальше →'}}function finish(){save(route.id,route.steps.length);app.innerHTML=top()+'<div class="nav"><button class="back" id="back">← Маршруты</button><span class="count">'+route.steps.length+' из '+route.steps.length+'</span></div><div class="progress"><div style="width:100%"></div></div><section class="done"><div class="kicker">Маршрут завершён ✓</div><h2>'+escapeHTML(route.name)+'</h2><p>Восемь эпизодов позади. Теперь можно выбрать другую историю — или вернуться к этой.</p></section><button class="primary" id="other">К другим маршрутам</button><button class="secondary" id="again">Пройти заново</button>';document.getElementById('back').onclick=home;document.getElementById('other').onclick=home;document.getElementById('again').onclick=()=>{save(route.id,0);index=0;selected=[];locked=false;render()};window.scrollTo(0,0)}home();
</script></body></html>
